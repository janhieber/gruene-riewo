#remote_theme: janhieber/jekyll-theme-gruene@main
theme: gruene-theme

#plugins:
#  - jekyll-remote-theme

title: Ortsverband Rielasingen-Worblingen
subtitle: Bündnis 90/Die Grünen
description: "Ortsverband Rielasingen-Worblingen"
baseurl: ""
url: ""

logo: /assets/img/logo.svg
favicon: /favicon.ico
hero_image: /assets/img/hero.jpg

# Kontakt / Social Media (leer lassen zum Ausblenden)
email: mail@janhieber.net
instagram: ""
facebook: ""
mastodon: ""

# Pflicht für das Theme (wird nicht aus dem Theme übernommen)
permalink: /news/:year/:month/:title/
future: true   # sonst werden Termine mit Datum in der Zukunft nicht erzeugt

collections:
  termine:
    output: true
    permalink: /termine/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: termine }
    values: { layout: termin }
  - scope: { path: "" }
    values: { layout: page }

exclude:
#  - _theme
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
